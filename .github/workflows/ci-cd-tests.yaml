name: ci-cd tests

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]
    
jobs:
  authenticationTest:
    runs-on: ubuntu-22.04
     
    steps:
      - name: Repository clone
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
            cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run test with Gradle
        run: ./gradlew test

