server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]

  # DATA CONFIGURATION
  datasource:
    url: jdbc:postgresql://localhost:5433/site_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 1800000
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true
    show_sql: false
    open-in-view: false

app:
  hash:
    hmac-key: ${HMAC_KEY}

jasypt:
  encryptor:
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    algorithm: ${JASYPT_ALGORITHM}
    password: ${JASYPT_PASSWORD}
    key-obtention-iterations: 10000
    pool-size: 1
    string-output-type: base64