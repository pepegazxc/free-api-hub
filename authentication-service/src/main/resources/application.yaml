server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]

# DATA CONFIGURATION
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/site_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 1800000
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true
    show_sql: false
    open-in-view: false
