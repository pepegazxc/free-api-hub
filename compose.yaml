#Postgres Data Base
services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - ./postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME} -d $${DB_NAME}"]
      interval: 15s
      timeout: 5s
      retries: 3
      start-period: 5s

  #Redis Data Base
  redis:
    image: redis:7-alpine3.24
    container_name: redis-container
    restart: always

    ports:
      - "6379:6379"

    volumes:
      - ./redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start-period: 5s

